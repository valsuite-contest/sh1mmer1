[package]
name = "m1nsh1m"
version = "1.0.0"
edition = "2021"
description = "M1NSH1M - Shim modifying automation tool rewritten in Rust"
authors = ["Mercury Workshop"]
license = "MIT"
readme = "README.md"

[[bin]]
name = "m1nsh1m"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
byteorder = "1.5"
uuid = { version = "1.6", features = ["v4"] }
crc32fast = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.9"
walkdir = "2.4"
scopeguard = "1.2"
flate2 = "1.0"
tar = "0.4"
which = "5.0"
regex = "1.10"
indicatif = "0.17"
sha1 = "0.10"
base64 = "0.21"
reqwest = { version = "0.11", features = ["blocking"] }
nix = { version = "0.27", features = ["fs", "mount", "process", "signal", "user"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.9"

[profile.release]
lto = true
strip = true
